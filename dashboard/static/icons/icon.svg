<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3e96e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#68bdfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#18191b"/>

  <!-- Icon: Person with radar waves representing presence detection -->
  <g transform="translate(256, 256)">
    <!-- Radar waves -->
    <path d="M-80,0 Q-40,-60 0,-80 Q40,-60 80,0"
          fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-60,0 Q-30,-40 0,-50 Q30,-40 60,0"
          fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M-40,0 Q-20,-20 0,-25 Q20,-20 40,0"
          fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

    <!-- Person silhouette -->
    <circle cx="0" cy="-50" r="25" fill="url(#grad1)"/>
    <path d="M-35,0 Q0,20 35,0 L35,60 Q35,70 25,70 L-25,70 Q-35,70 -35,60 Z"
          fill="url(#grad1)"/>

    <!-- Dot for presence detection point -->
    <circle cx="0" cy="85" r="8" fill="#46a758"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="128" y="440" width="256" height="8" rx="4" fill="url(#grad1)"/>
</svg>
